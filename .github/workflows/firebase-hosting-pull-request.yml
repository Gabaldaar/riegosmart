# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR
on:
  pull_request:
    paths:
      - 'app/**'
      - 'firebase.json'
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Firebase Preview
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DOSIMAT_IOT }}
        run: |
          echo "$FIREBASE_SA" > firebase-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS="${GITHUB_WORKSPACE}/firebase-sa.json"
          npx firebase-tools hosting:channel:deploy pr-${{ github.event.number }} --project dosimat-iot
          rm firebase-sa.json
